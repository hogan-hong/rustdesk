# Internal Windows build: LAN-only direct-IP RustDesk (full + host-only packages)
name: build-internal-windows

on:
  workflow_dispatch:

env:
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    name: internal windows x64 (full + host)
    needs: [generate-bridge, build-RustDeskTempTopMostWindow]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f4100
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
          Write-Host "Flutter root: $flutterRoot"
          $engineDir = "$flutterRoot/bin/cache/artifacts/engine/windows-x64-release"
          if (-not (Test-Path $engineDir)) { throw "engine dir not found: $engineDir" }
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* $engineDir/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: internal-win-x64

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build rustdesk
        shell: bash
        run: |
          python3 build.py --portable --flutter --skip-portable-pack --hwcodec --vram

      - name: Assemble package folder
        shell: bash
        run: |
          mkdir -p ./rustdesk
          cp -r flutter/build/windows/x64/runner/Release/* ./rustdesk/
          cp scripts/internal-deploy/install.ps1 ./rustdesk/
          cp scripts/internal-deploy/README-部署说明.md ./rustdesk/

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Zip full package (no custom.txt)
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/* -DestinationPath ./rustdesk-internal-full-windows-x64.zip

      - name: Build host MSI (custom.txt included)
        shell: pwsh
        run: |
          cp tools/custom-client/host-custom.txt ./rustdesk/custom.txt
          pushd res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" }
          Write-Host "msbuild: $msbuild"
          & $msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          popd
          $msi = Get-ChildItem ./res/msi/Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ./rustdesk-internal-host-windows-x64.msi

      - name: Build full MSI
        shell: pwsh
        run: |
          rm ./rustdesk/custom.txt
          git checkout -- res/msi
          pushd res/msi
          python preprocess.py --arp -d ../../rustdesk
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) { $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\MSBuild\Current\Bin\MSBuild.exe" }
          & $msbuild msi.sln -t:clean -p:Configuration=Release -p:Platform=x64
          & $msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          popd
          $msi = Get-ChildItem ./res/msi/Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName ./rustdesk-internal-full-windows-x64.msi

      - name: Zip host package (with custom.txt)
        shell: pwsh
        run: |
          cp tools/custom-client/host-custom.txt ./rustdesk/custom.txt
          Compress-Archive -Path ./rustdesk/* -DestinationPath ./rustdesk-internal-host-windows-x64.zip -Force
          Remove-Item ./rustdesk/custom.txt

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-internal-windows-x64
          path: ./rustdesk-internal-*
          if-no-files-found: error
          retention-days: 30
